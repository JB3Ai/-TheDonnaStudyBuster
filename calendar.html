<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Calendar - The Donna Study Buster!</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="app-title">🐢 The Donna Study Buster! 🐼</h1>
            <p class="subtitle">Grade 5 South African CAPS</p>
        </header>

        <nav class="subject-tabs" id="subjectTabs"></nav>

        <main>
            <div class="calendar-header">
                <h2>📅 June 2026 Exam Calendar</h2>
                <p>Plan your study time wisely, Donna!</p>
            </div>

            <div id="countdownBanner" class="countdown-banner hidden">
                <span id="nextExamSubject"></span>
                <span id="countdownDays" class="countdown-number">0</span>
                <span id="countdownLabel">days until next exam</span>
            </div>

            <div id="calendarGrid" class="calendar-grid"></div>
        </main>

        <footer>
            <p>Made with ❤️ for Donna's study time</p>
        </footer>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/calendar.js"></script>
</body>
</html>
